<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central de E-mails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="application/json" id="claude-artifacts-manifest">{"permissions":["notifications","menu-bar"]}</script>
<style>
/* ===== Tokens (sistema de design) ===== */
:root{
  /* cor */
  --bg:#eaf3f0; --surface:#ffffff; --surface-2:#f5faf8; --ink:#14201d; --muted:#5b6d68; --line:#dfeae6;
  --accent:#0f9d84; --accent-strong:#0a7a67; --accent-soft:#e1f5ef; --bubble-out:#d6f4e7;
  --alta:#c2410c; --alta-soft:#fde9df; --media:#9a6200; --media-soft:#fbefcf; --baixa:#5b6d68; --baixa-soft:#eaf0ee;
  --danger:#b42318; --ok:#12805c;
  --wall:rgba(15,157,132,.08);
  /* tipografia */
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-xs:12px; --fs-sm:13px; --fs-md:14.5px; --fs-lg:17px; --fs-xl:20px;
  /* espaço (base 4) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  /* forma e elevação */
  --r-sm:10px; --r-md:16px; --r-pill:999px;
  --sh-1:0 1px 1px rgba(16,32,28,.05),0 1px 3px rgba(16,32,28,.06);
  --sh-2:0 8px 28px rgba(16,32,28,.14);
  --tap:44px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1514;--surface:#16211f;--surface-2:#1b2826;--ink:#e6efec;--muted:#9bb0aa;--line:#26352f;
    --accent:#2dd4b4;--accent-strong:#3fe0c1;--accent-soft:#12312c;--bubble-out:#134b3d;
    --alta:#fb923c;--alta-soft:#3a2214;--media:#facc15;--media-soft:#33290b;--baixa:#9bb0aa;--baixa-soft:#202e2a;
    --danger:#f87171;--ok:#4ade80;--wall:rgba(45,212,180,.07);--sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 8px 28px rgba(0,0,0,.5)}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:var(--fs-md)/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
svg.i.dots{stroke-width:3.2}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== Estrutura ===== */
#app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(300px,360px) 1fr;max-width:1400px;margin:0 auto;background:var(--surface);box-shadow:var(--sh-1)}
#side{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;background:var(--surface)}
.side-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);min-height:64px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.side-head h1{margin:0;font-size:var(--fs-lg);font-weight:700;letter-spacing:-.01em;flex:1}
.ib{width:var(--tap);height:var(--tap);border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:var(--surface-2)}
#chatlist{overflow:auto;flex:1;padding:var(--s1) var(--s2) var(--s4)}
.ci{display:grid;grid-template-columns:48px 1fr auto;gap:0 var(--s3);align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:var(--r-md);padding:var(--s3);min-height:72px}
.ci:hover{background:var(--surface-2)}
.ci[aria-current="true"]{background:var(--accent-soft)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.av.bot{background:var(--accent)}
.av.sm{width:32px;height:32px;font-size:var(--fs-xs)}
.ci-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-prev{grid-column:2;color:var(--muted);font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-meta{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:stretch;justify-content:center}
.ci-time{font-size:var(--fs-xs);color:var(--muted)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-size:var(--fs-xs);font-weight:700;display:grid;place-items:center;padding:0 7px}
.badge.alert{background:var(--alta)}
.side-foot{padding:var(--s3) var(--s4);color:var(--muted);font-size:var(--fs-xs);border-top:1px solid var(--line)}

#conv{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;background:var(--bg)}
.conv-head{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);min-height:64px;background:var(--surface);border-bottom:1px solid var(--line)}
.conv-head .back{display:none}
.conv-title{flex:1;min-width:0;line-height:1.25}
.conv-title b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-title span{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.conv-title span.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
.conv-title span.err{color:var(--alta)}
#searchrow{padding:var(--s2) var(--s3);background:var(--surface);border-bottom:1px solid var(--line)}
.field-in{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-pill);padding:10px 16px;min-height:var(--tap)}
#chips{display:flex;gap:var(--s2);overflow-x:auto;padding:var(--s2) var(--s3);background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:6px 14px;font-weight:500;font-size:var(--fs-sm);min-height:36px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:600}
.chip small{margin-left:6px;color:var(--muted);font-weight:600}
#banner:empty{display:none}
.banner{margin:var(--s3) var(--s3) 0;padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--media-soft);display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;font-size:var(--fs-sm)}
.banner.err{background:var(--alta-soft)}

/* ===== Mensagens ===== */
.msgs{flex:1;min-height:0;overflow-y:auto;padding:var(--s4) var(--s3) var(--s5);background-image:radial-gradient(var(--wall) 1.2px,transparent 1.2px);background-size:24px 24px;scroll-behavior:smooth}
.msgs>*{max-width:720px;margin-left:auto;margin-right:auto}
.row{display:flex;gap:var(--s2);margin:var(--s2) auto;align-items:flex-end}
.row.out{justify-content:flex-end}
.row.bot{padding-left:40px}
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);border-radius:var(--r-md);border-top-left-radius:4px;max-width:min(560px,100%);min-width:0;overflow:hidden}
.row.out .bubble{background:var(--bubble-out);border-color:transparent;border-top-left-radius:var(--r-md);border-top-right-radius:4px;box-shadow:none}
.bubble.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--sh-1)}}
.bp{padding:var(--s3) var(--s4) var(--s2)}
.row.out .bp{padding:var(--s2) var(--s4)}
.pr{font-size:var(--fs-xs);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:2px;color:var(--muted)}
.pr .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor}
.pr.alta{color:var(--alta)} .pr.media{color:var(--media)} .pr.baixa{color:var(--baixa)}
.tag.unread{background:var(--accent-soft);color:var(--accent-strong)}
.who{font-weight:600;font-size:var(--fs-sm)}
.subj{font-weight:600;margin:2px 0}
.prev{color:var(--muted);font-size:var(--fs-sm);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:var(--fs-xs);font-weight:600;padding:2px 8px;border-radius:var(--r-pill);background:var(--baixa-soft);color:var(--muted)}
.foot{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:0 var(--s4) var(--s2);margin-top:2px}
.ticks{color:var(--accent-strong);font-weight:700;letter-spacing:-2px}
.bbtns{border-top:1px solid var(--line)}
.bbtn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:var(--tap);border:0;border-top:1px solid var(--line);background:transparent;color:var(--accent-strong);font-weight:600;font-size:var(--fs-md);text-decoration:none;padding:0 var(--s4)}
.bbtns>.bbtn:first-child{border-top:0}
.bbtn:hover{background:var(--surface-2)}
.bbtn.danger{color:var(--danger)}
.bbtns.two{display:grid;grid-template-columns:1fr 1fr}
.bbtns.two>.bbtn{border-top:0}
.bbtns.two>.bbtn+.bbtn{border-left:1px solid var(--line)}
.bbtn.quiet{color:var(--muted);font-weight:500;font-size:var(--fs-sm);min-height:40px;border-top:1px solid var(--line)}
.bbtn[disabled]{opacity:.5;cursor:default}
.quote{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:6px;padding:6px 10px;margin:0 0 var(--s2);cursor:pointer;font-size:var(--fs-sm);width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0}
.quote b{display:block;font-size:var(--fs-xs);color:var(--accent-strong)}
.quote span{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{font-weight:700;font-size:var(--fs-xs);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:var(--s2) 0 var(--s1)}
.bt:first-child{margin-top:0}
.bubble ul{margin:0 0 var(--s2);padding-left:20px}
.bubble li{margin:2px 0}
.bubble p{margin:0 0 var(--s2)}
.scroll{white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;font-size:var(--fs-sm);background:var(--surface-2);border-radius:var(--r-sm);padding:var(--s3)}
.err-t{color:var(--danger);font-weight:500}.ok-t{color:var(--ok);font-weight:600}
.typing{display:inline-flex;gap:4px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5;animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.tones{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 var(--s2)}
.tone{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:4px 12px;font-size:var(--fs-sm);font-weight:500;min-height:36px}
.tone[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
textarea.draft{width:100%;min-height:160px;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:var(--s3);resize:vertical;line-height:1.55;font-size:var(--fs-md)}
input.tf,input.df{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;min-height:var(--tap);margin-bottom:var(--s2)}
.sep{display:flex;justify-content:center;margin:var(--s4) auto var(--s2)}
.pill{background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);border-radius:var(--r-pill);padding:4px 14px;font-size:var(--fs-xs);font-weight:600;color:var(--muted)}
.pill.new{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent}
button.pill{cursor:pointer;min-height:32px}
button.pill:hover{background:var(--surface-2)}
#fab{position:absolute;right:var(--s4);bottom:92px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-2);display:grid;place-items:center;color:var(--ink)}
#fab .badge{position:absolute;top:-8px;right:-4px}

/* ===== Composer ===== */
#composer{background:var(--surface);border-top:1px solid var(--line);padding:var(--s2) var(--s3) calc(var(--s2) + env(safe-area-inset-bottom))}
.qr{display:flex;gap:var(--s2);overflow-x:auto;padding-bottom:var(--s2);scrollbar-width:none}
.qr::-webkit-scrollbar{display:none}
.cmp{display:flex;gap:var(--s2);align-items:center}
.cmp input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-pill);padding:10px 18px;min-height:var(--tap)}
.cmp input[type=date]{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-pill);padding:8px 12px;min-height:var(--tap)}
.send{width:var(--tap);height:var(--tap);border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.send:hover{filter:brightness(1.06)}
.send[disabled]{opacity:.5}

/* ===== Tarefas e resumo ===== */
.task{display:grid;grid-template-columns:28px 1fr auto;gap:var(--s3);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3) var(--s4);margin:var(--s2) auto;box-shadow:var(--sh-1)}
.task input{width:22px;height:22px;accent-color:var(--accent)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-weight:600}.note{font-size:var(--fs-sm);color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:4px 12px;font-size:var(--fs-sm);font-weight:600;color:var(--accent-strong);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.mini.danger{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:var(--s6) var(--s4)}

/* ===== Toast, menu, modal ===== */
#toasts{position:fixed;bottom:132px;right:var(--s5);display:flex;flex-direction:column;gap:var(--s2);z-index:70;max-width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:var(--s3);align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r-md);padding:var(--s3) var(--s4);box-shadow:var(--sh-2);cursor:pointer;text-align:left;animation:slide .25s ease-out}
.toast b{display:block;font-size:var(--fs-sm)}.toast span{font-size:var(--fs-sm);color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
@keyframes slide{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
#menu{position:fixed;z-index:65}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-2);padding:var(--s1);min-width:230px}
.mi{display:flex;gap:var(--s3);align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:var(--r-sm);min-height:var(--tap)}
.mi:hover{background:var(--surface-2)}
.modal-bg{position:fixed;inset:0;background:rgba(8,16,14,.5);z-index:80;display:grid;place-items:center;padding:var(--s4)}
.modal{background:var(--surface);border-radius:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:var(--s5);box-shadow:var(--sh-2)}
.modal h2{margin:0 0 var(--s1)}
.field{margin:var(--s4) 0}.field label{display:block;font-weight:600;font-size:var(--fs-sm);margin-bottom:6px}
.field select,.field textarea,.field input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;min-height:var(--tap)}
.field .check,.check{display:flex;margin-bottom:0;gap:var(--s3);align-items:center;font-weight:500}.check input{width:22px;height:22px;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 16px;font-weight:600;min-height:var(--tap);display:inline-flex;align-items:center;gap:var(--s2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:var(--fs-sm)}
.sticky{position:sticky;bottom:calc(var(--s5) * -1);background:var(--surface);padding:var(--s3) 0 var(--s1)}

/* ===== Celular ===== */
@media (max-width:860px){
  #app{grid-template-columns:1fr;position:relative}
  #side,#conv{grid-area:1/1}
  #app[data-mobile="chat"] #side{display:none}
  #app[data-mobile="list"] #conv{display:none}
  .conv-head .back{display:grid}
  .row.bot{padding-left:0}
  .msgs{padding-left:var(--s2);padding-right:var(--s2)}
  #toasts{left:var(--s3);right:var(--s3);max-width:none;bottom:150px}
  #btnRefresh{display:none}
  .chip{min-height:40px}
  .ib{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app" data-mobile="chat">
  <aside id="side" aria-label="Conversas">
    <header class="side-head">
      <div class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 8l9 6 9-6"/><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg></div>
      <h1>Central de E-mails</h1>
      <button class="ib" id="btnSettings" aria-label="Configurações" title="Configurações"></button>
    </header>
    <div id="chatlist"></div>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <section id="conv" aria-label="Conversa">
    <header class="conv-head">
      <button class="ib back" id="btnBack" aria-label="Voltar para a lista"></button>
      <div id="headav"></div>
      <div class="conv-title"><b id="headname"></b><span id="headsub"></span></div>
      <button class="ib" id="btnSearch" aria-label="Buscar nos e-mails" title="Buscar"></button>
      <button class="ib" id="btnRefresh" aria-label="Atualizar agora" title="Atualizar agora"></button>
      <button class="ib" id="btnMore" aria-label="Mais opções" title="Mais opções" aria-haspopup="menu"></button>
    </header>
    <div id="searchrow" hidden><input class="field-in" id="q" type="text" placeholder="Buscar remetente, assunto ou prévia" aria-label="Buscar nos e-mails"></div>
    <div id="chips" role="group" aria-label="Filtros"></div>
    <div id="banner"></div>
    <div class="msgs" id="msgs" role="log" aria-label="Mensagens"></div>
    <button id="fab" hidden aria-label="Ir para as mensagens mais recentes"></button>
    <footer id="composer"></footer>
  </section>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="menu"></div>
<div id="modal"></div>

<script type="module">
/* ============ utilidades ============ */
const MS = 'Microsoft 365';
const $ = (s) => document.querySelector(s);
const ICONS = {
  back: 'M15 18l-6-6 6-6', refresh: 'M20 11a8 8 0 1 0-2.3 5.6M20 4v7h-7', search: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',
  more: 'M12 5.5h.01M12 12h.01M12 18.5h.01', send: 'M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z', ext: 'M14 3h7v7M10 14L21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5',
  mail: 'M3 8l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z', tasks: 'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',

const fold = (s) => String(s || '').replace(/[\u00C0-\u017F]/g, (c) => c.normalize('NFD')[0]).toLowerCase();
function myAliases() {
  let a = terms(S.settings.mencoes).map((x) => fold(x).replace(/^@/, '').trim()).filter(Boolean);
  if (!a.length) { const f = fold(S.settings.assinatura).trim().split(/\s+/)[0]; if (f && f !== 'seu') a = [f]; }
  return a;
}
function findMention(text) {
  const al = myAliases(); if (!al.length) return null;
  const t = String(text || ''), f = fold(t);
  const alt = al.map((a) => a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+')).join('|');
  const m = new RegExp('(^|[^\\p{L}\\p{N}_.@-])@(?:' + alt + ')(?![\\p{L}\\p{N}_]|\\.[a-z])', 'u').exec(f); if (!m) return null;
  const start = m.index + m[1].length, end = m.index + m[0].length;
  const rest = t.slice(end, end + 260).replace(/^[\s,:;.\-–—]+/, '');
  const line = rest.split(/\n/)[0].trim();
  const task = (line.length >= 3 ? line : rest.replace(/\s+/g, ' ').trim()).slice(0, 220);
  return { task, ctx: t.slice(Math.max(0, start - 150), end + 350).replace(/\s+/g, ' ').trim(), h: K(fold(task).replace(/\s+/g, ' ').slice(0, 80)) };
}
const isMention = (e) => ['t', 'm', 'd'].includes(S.mentions[K(e.id)]);
async function mentionTask(e, hit) {

    const hoje = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
    const o = await askJson('Hoje é ' + hoje + '. Neste e-mail, alguém mencionou com @ a pessoa dona da caixa e pediu algo. Transforme o pedido em uma tarefa curta (verbo no infinitivo, até 12 palavras), em português do Brasil, sem inventar nada além do trecho. Se houver prazo, converta para a data AAAA-MM-DD usando a data de hoje; se não houver, use null. Responda APENAS com JSON: {"tarefa":"...","prazo":"AAAA-MM-DD ou null"}\n\nAssunto: ' + e.subject + '\nDe: ' + e.fromName + '\nTrecho: ' + hit.ctx, { modelTier: 'quick' });
    const title = String(o.tarefa || '').trim().slice(0, 140) || fallback;
    const due = /^\d{4}-\d{2}-\d{2}$/.test(String(o.prazo || '')) ? String(o.prazo) : '';

  } catch { return { title: fallback, due: '' }; }
}
async function scanMention(e) {
  const k = K(e.id); if (S.mentions[k]) return null;
  let hit = findMention(e.subject + '\n' + e.preview);
  if (!hit && !S.demo && mcp) { try { hit = findMention(await ensureBody(e)); } catch { return 'erro'; } }
  if (!hit) { S.mentions[k] = 'n'; persist(); return null; }
  if (S.mhash[hit.h]) { S.mentions[k] = 'd'; persist(); return null; }
  S.mhash[hit.h] = 1;
  if (!S.prio[k] || S.prio[k].p !== 'alta') S.prio[k] = { p: 'alta', m: 'você foi mencionado' };
  if (!S.settings.mencaoAuto) { S.mentions[k] = 'm'; persist(); return { e, task: null }; }
  const { title, due } = await mentionTask(e, hit);
  const t = addTask(title, due, e); t.src = 'menção'; S.mentions[k] = 't'; persist();
  return { e, task: t };
}

function drawIcon() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  x.fillStyle = '#0f9d84'; x.beginPath(); const r = 56; x.moveTo(r, 0); x.arcTo(256, 0, 256, 256, r); x.arcTo(256, 256, 0, 256, r); x.arcTo(0, 256, 0, 0, r); x.arcTo(0, 0, 256, 0, r); x.fill();
  x.strokeStyle = '#fff'; x.lineWidth = 14; x.lineJoin = 'round'; x.lineCap = 'round'; x.strokeRect(58, 78, 140, 100);
  x.beginPath(); x.moveTo(62, 86); x.lineTo(128, 138); x.lineTo(194, 86); x.stroke(); return c.toDataURL('image/png');
}
